<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e13" />
      <stop offset="50%" stop-color="#090a0d" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <!-- Subtle Cyan Aura -->
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Subtle Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Subtle Radial Aura -->
  <circle cx="600" cy="450" r="405" fill="url(#auraGrad)" />

  <!-- Architectural Registration Marks (Four Corners) -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
    <!-- Top-Left -->
    <line x1="36" y1="46" x2="56" y2="46" />
    <line x1="46" y1="36" x2="46" y2="56" />

    <!-- Top-Right -->
    <line x1="1144" y1="46" x2="1164" y2="46" />
    <line x1="1154" y1="36" x2="1154" y2="56" />

    <!-- Bottom-Left -->
    <line x1="36" y1="854" x2="56" y2="854" />
    <line x1="46" y1="844" x2="46" y2="864" />

    <!-- Bottom-Right -->
    <line x1="1144" y1="854" x2="1164" y2="854" />
    <line x1="1154" y1="844" x2="1154" y2="864" />
  </g>

  <!-- Thin Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" rx="4" />
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" rx="2" />

  <!-- Top Header Metadata -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5">
    <text x="70" y="52" fill="#38bdf8" text-anchor="start">SPECIMEN // PLACEHOLDER</text>
    <text x="1130" y="52" fill="#94a3b8" text-anchor="end">4:3 • 1200 × 900</text>
  </g>

  <!-- Top Category Line -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="3">
    <text x="70" y="80" fill="#64748b" text-anchor="start">+ CREDENTIAL // 07 • DESIGN CREDENTIAL</text>
  </g>

  <!-- Center Composition: Photographic Camera Aperture Icon -->
  <g transform="translate(600, 365)" stroke="#38bdf8" stroke-opacity="0.8" fill="none">
    <circle cx="0" cy="0" r="38" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="28" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.15" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <!-- Aperture Blades -->
    <line x1="0" y1="-28" x2="16" y2="-10" stroke-width="1" />
    <line x1="24" y1="-14" x2="14" y2="14" stroke-width="1" />
    <line x1="18" y1="22" x2="-8" y2="20" stroke-width="1" />
    <line x1="-22" y1="18" x2="-20" y2="-10" stroke-width="1" />
    <line x1="-12" y1="-26" x2="8" y2="-22" stroke-width="1" />
  </g>

  <!-- Central Title Typography -->
  <g text-anchor="middle">
    <!-- Main Title (Instrument Serif/Editorial Style) -->
    <text x="600" y="460" font-family="Georgia, Cambria, serif" font-size="34" font-weight="400" letter-spacing="1" fill="#f8fafc">
      CANVA SKILLS ADD-ON CERTIFICATE
    </text>

    <!-- Subtitle (Clean Sans) -->
    <text x="600" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="3" fill="#38bdf8">
      VISUAL COMMUNICATION DESIGN
    </text>

    <!-- Intended Subject Description -->
    <text x="600" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="0.5" fill="#94a3b8">
      Visual communication, graphic composition, and digital layout certificate document scan
    </text>
  </g>

  <!-- Bottom Colophon Bar -->
  <line x1="60" y1="824" x2="1140" y2="824" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="2">
    <text x="70" y="850" fill="#64748b" text-anchor="start">AJIN SHIBU OFFICIAL ARCHIVE</text>
    <text x="600" y="850" fill="#38bdf8" text-anchor="middle" font-weight="600">● PENDING REAL PHOTOGRAPH</text>
    <text x="1130" y="850" fill="#64748b" text-anchor="end">REPLACEABLE ASSET</text>
  </g>
</svg>